name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      FTP_PASS: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and PHP Hostinger bundle
        run: npm run build:hostinger

      - name: Push public_html build to hostinger-live branch
        run: |
          cd hostinger-deploy/public_html
          git init -b hostinger-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger-live

      # Method A (Recommended): Fast SSH rsync over Hostinger port 65002
      - name: Setup SSH Key for Hostinger
        if: env.SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH rsync to Hostinger
        if: env.SSH_KEY != ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          PORT="${SSH_PORT:-65002}"
          TARGET="${SSH_DIR:-/home/${SSH_USER}/domains/toufiqmotion.com/public_html/}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            --filter='P uploads/*' \
            --filter='P api/config/config.local.php' \
            -e "ssh -p $PORT" \
            hostinger-deploy/public_html/ \
            "${SSH_USER}@${SSH_HOST}:${TARGET}"

      # Method B (Alternative): FTP Deploy if FTP_PASSWORD secret is provided instead of SSH
      - name: Deploy via FTP to Hostinger
        if: env.SSH_KEY == '' && env.FTP_PASS != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./hostinger-deploy/public_html/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config/config.local.php
